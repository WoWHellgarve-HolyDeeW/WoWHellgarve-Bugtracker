{
  "name": "Suggestion or realm rule",
  "description": "Propose a workflow, UI change or custom realm rule.",
  "title": "[Request] ",
  "labels": [
    "suggestion"
  ],
  "body": [
    {
      "type": "textarea",
      "id": "request",
      "attributes": {
        "label": "Requested change"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "reason",
      "attributes": {
        "label": "Who needs it and why?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "current",
      "attributes": {
        "label": "Current behavior and proposed rule",
        "description": "Separate a custom preference from expected retail behavior."
      },
      "validations": {
        "required": true
      }
    }
  ]
}
